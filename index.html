<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1218">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1218'/%3E%3Cpath d='M16 6.5 25.5 25 H6.5 Z' fill='none' stroke='%23c9a66a' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M11 19 H21' stroke='%23c9a66a' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <meta name="description" content="Führe dein Volk durch fünf Zeitalter. Baue deine Armee, verteidige deine Basis und entscheide die Schlacht in Age of Max.">
  <title>Age of Max: Fünf Zeitalter. Ein Schlachtfeld.</title>
  <style>
    :root { color-scheme: dark; background: #080e13; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; background: radial-gradient(ellipse at center, #17242b 0%, #080e13 75%); font-family: "Segoe UI", Arial, sans-serif; }
    #game-canvas { width: 100%; height: 100%; overflow: hidden; }
    #game-canvas canvas { display: block; touch-action: none; outline: none; }
    noscript { color: #f1ebde; padding: 2rem; position: fixed; inset: 30% 15%; }
    /* Upright phones scale the 16:9 battlefield down to an unreadable strip. */
    #rotate-hint { display: none; }
    @media (orientation: portrait) and (max-width: 820px) {
      #rotate-hint {
        display: grid; position: fixed; inset: 0; z-index: 10; place-content: center; justify-items: center;
        gap: 1.5rem; padding: 2rem; text-align: center; background: #080e13; color: #f1ebde;
      }
      #rotate-hint svg { width: 74px; height: 74px; }
      #rotate-hint strong { display: block; font-size: 1.35rem; font-weight: 600; letter-spacing: 0.01em; }
      #rotate-hint span { display: block; margin-top: 0.6rem; font-size: 0.95rem; color: #aeb8b7; }
    }
  </style>
</head>
<body>
  <div id="game-canvas" role="application" aria-label="Age of Max Strategiespiel. Menüs: Tab und Enter. Spielhilfe im Hauptmenü."></div>
  <div id="rotate-hint" role="status">
    <svg viewBox="0 0 48 48" fill="none" stroke="#c9a66a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="17" y="6" width="14" height="26" rx="2.6"/>
      <path d="M10 36a14 14 0 0 0 28 0"/>
      <path d="M6 32l4 4 4-4"/>
    </svg>
    <p><strong>Drehe dein Gerät quer.</strong><span>Age of Max braucht die Breitseite: fünf Zeitalter, ein Schlachtfeld.</span></p>
  </div>
  <noscript>Age of Max benötigt JavaScript. Aktiviere JavaScript in deinem Browser, um zu spielen.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
